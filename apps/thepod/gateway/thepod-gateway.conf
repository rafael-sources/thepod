# thePod · a single app under thepod.castmedia.space
#
# The host (outside this container) routes thepod.castmedia.space to this port 5003.
# It used to be served by thePod (gunicorn) directly; now nginx serves it and dispatches:
#   /        → thePod   (gunicorn 5005)   landing, docs, account, PWA manifest
#   /pre/    → prePod   (gunicorn 5001)
#   /prod/   → prodPod  (gunicorn 5002)
#   /ama/    → amaPod   (gunicorn 5004)
#   /post/   → postPod  (gunicorn 5000)
# Each app receives X-Forwarded-Prefix and, with ProxyFix(x_prefix=1), builds its URLs with the prefix.
# The subdomains (prepod.castmedia.space…) are still live: the host routes them to their ports as always.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The host has already terminated TLS; if it does not send X-Forwarded-Proto, assume https.
map $http_x_forwarded_proto $pod_proto {
    default $http_x_forwarded_proto;
    ''      https;
}

server {
    listen 5003;
    server_name _;

    client_max_body_size 0;          # large uploads (postPod, prodPod) pass through whole
    proxy_request_buffering off;     # and are streamed, not saved to disk first
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $pod_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # /pre without slash → /pre/ (so the service worker and relative paths work)
    location = /pre  { return 301 /pre/$is_args$args; }
    location = /prod { return 301 /prod/$is_args$args; }
    location = /ama  { return 301 /ama/$is_args$args; }
    location = /post { return 301 /post/$is_args$args; }

    location /pre/ {
        proxy_set_header X-Forwarded-Prefix /pre;
        proxy_pass http://127.0.0.1:5001/;
    }
    location /prod/ {
        proxy_set_header X-Forwarded-Prefix /prod;
        proxy_pass http://127.0.0.1:5002/;
    }
    location /ama/ {
        proxy_set_header X-Forwarded-Prefix /ama;
        proxy_pass http://127.0.0.1:5004/;
    }
    location /post/ {
        proxy_set_header X-Forwarded-Prefix /post;
        proxy_pass http://127.0.0.1:5000/;
    }

    location / {
        proxy_pass http://127.0.0.1:5005;
    }
}
