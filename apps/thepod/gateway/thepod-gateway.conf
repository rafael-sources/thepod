# thePod · una sola app bajo thepod.castmedia.space
#
# El host (fuera de este contenedor) manda thepod.castmedia.space a este puerto 5003.
# Antes lo atendía thePod (gunicorn) directo; ahora lo atiende nginx y reparte:
#   /        → thePod   (gunicorn 5005)   landing, docs, cuenta, manifiesto de la PWA
#   /pre/    → prePod   (gunicorn 5001)
#   /prod/   → prodPod  (gunicorn 5002)
#   /ama/    → amaPod   (gunicorn 5004)
#   /post/   → postPod  (gunicorn 5000)
# Cada app recibe X-Forwarded-Prefix y, con ProxyFix(x_prefix=1), arma sus URLs con el prefijo.
# Los subdominios (prepod.castmedia.space…) siguen vivos: el host los manda a sus puertos como siempre.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# El host ya terminó TLS; si no manda X-Forwarded-Proto, asumimos https.
map $http_x_forwarded_proto $pod_proto {
    default $http_x_forwarded_proto;
    ''      https;
}

server {
    listen 5003;
    server_name _;

    client_max_body_size 0;          # subidas grandes (postPod, prodPod) pasan enteras
    proxy_request_buffering off;     # y se van transmitiendo, no se guardan primero en disco
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $pod_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # /pre sin barra → /pre/ (así el service worker y las rutas relativas quedan bien)
    location = /pre  { return 301 /pre/$is_args$args; }
    location = /prod { return 301 /prod/$is_args$args; }
    location = /ama  { return 301 /ama/$is_args$args; }
    location = /post { return 301 /post/$is_args$args; }

    location /pre/ {
        proxy_set_header X-Forwarded-Prefix /pre;
        proxy_pass http://127.0.0.1:5001/;
    }
    location /prod/ {
        proxy_set_header X-Forwarded-Prefix /prod;
        proxy_pass http://127.0.0.1:5002/;
    }
    location /ama/ {
        proxy_set_header X-Forwarded-Prefix /ama;
        proxy_pass http://127.0.0.1:5004/;
    }
    location /post/ {
        proxy_set_header X-Forwarded-Prefix /post;
        proxy_pass http://127.0.0.1:5000/;
    }

    location / {
        proxy_pass http://127.0.0.1:5005;
    }
}
